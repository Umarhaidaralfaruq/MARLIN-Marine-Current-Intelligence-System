<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MARLIN - Mode Forecaster</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/2.2.1/chartjs-plugin-annotation.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- TAMBAHKAN BARIS INI: Plugin Heatmap untuk visualisasi mulus -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #020617; 
            background-image: radial-gradient(circle at top right, #0f172a, #020617);
            color: #e2e8f0;
        }

        /* TEMA KACA (GLASSMORPHISM) */
        .glass-panel {
            background: linear-gradient(135deg, rgba(15,23,42,0.7) 0%, rgba(2,6,23,0.8) 100%);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            padding: 20px;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* HEADER NAVBAR */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 30px; border-bottom: 1px solid rgba(148,163,184,0.1);
            background: rgba(15,23,42,0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .nav-left img { height: 40px; }
        .nav-left h1 { margin: 0; font-size: 1.3em; letter-spacing: 1px; color: #f8fafc; }
        .nav-left span { color: #38bdf8; font-size: 0.8em; border: 1px solid #38bdf8; padding: 2px 8px; border-radius: 12px; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        
        /* DROPDOWN BASERUN */
        .baserun-select {
            background: rgba(15,23,42,0.9); color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 6px;
            padding: 8px 12px; font-weight: bold; font-size: 0.9em; cursor: pointer;
            outline: none; box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }
        .baserun-select option { background: #0f172a; color: white; }

        .back-btn {
            background: transparent; border: 1px solid #475569; border-radius: 6px;
            padding: 8px 16px; color: #cbd5e1; text-decoration: none; font-weight: bold;
            transition: 0.3s; font-size: 0.9em;
        }
        .back-btn:hover { background: #1e293b; color: white; border-color: #94a3b8; }

        /* GRID LAYOUT UTAMA */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px; padding: 20px 30px;
        }

        h2 { margin-top: 0; font-size: 1.05em; color: #f8fafc; border-bottom: 1px solid rgba(148,163,184,0.2); padding-bottom: 10px; margin-bottom: 15px; }
        
        /* PETA SPASIAL KOSONG (TANPA SATELIT) */
        .map-container { flex-grow: 1; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid rgba(148,163,184,0.2); }
        /*.leaflet-container { background: #0f172a !important; } /* Warna dasar peta polos */
        
        /* OVERLAY METRIK RMSE DI ATAS PETA */
        .rmse-overlay {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(148,163,184,0.3);
            backdrop-filter: blur(5px); border-radius: 8px; padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; pointer-events: none;
        }
        .rmse-overlay .title { font-size: 0.75em; color: #94a3b8; font-weight: bold; margin-bottom: 4px; text-transform: uppercase;}
        .rmse-overlay .value { font-size: 1.8em; font-weight: bold; color: #f8fafc; line-height: 1; }
        .rmse-overlay .unit { font-size: 0.4em; font-weight: normal; color: #94a3b8; }
        .rmse-overlay .badge { margin-top: 5px; padding: 2px 8px; font-size: 0.7em; font-weight: bold; border-radius: 4px; display: inline-block; }
        
        .badge-good { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .badge-warn { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-left">
            <img src="Logo_BMKG.png" alt="BMKG">
            <div>
                <h1>MARLIN <span>Forecaster Mode</span></h1>
            </div>
        </div>
        <div class="nav-right">
            <select class="baserun-select" id="baserun-dropdown">
                <option value="1">prediksi_spasial_20261013_0000.csv (Terbaru)</option>
                <option value="2">prediksi_spasial_20261012_1200.csv</option>
                <option value="3">prediksi_spasial_20261012_0000.csv</option>
            </select>
            <a href="index.html" class="back-btn">Kembali</a>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="container">
        
        <!-- ================= BARIS 1: GRAFIK TIME SERIES ================= -->
        
        <div class="glass-panel" style="height: 380px;">
            <h2 id="forecast-title">📈 Prakiraan Operasional</h2>
            <div style="position: relative; flex-grow: 1; width: 100%;">
                <canvas id="forecastChart"></canvas>
            </div>
        </div>

        <div class="glass-panel" style="height: 380px;">
            <h2 id="validation-title">✅ Validasi Model vs HF Radar</h2>
            <div style="position: relative; flex-grow: 1; width: 100%;">
                <canvas id="validationChart"></canvas>
            </div>
        </div>

        <!-- ================= BARIS 2: VALIDASI SPASIAL (PETA DUMMY) ================= -->

        <div class="glass-panel" style="height: 450px;">
            <h2>🎯 Validasi Spasial: RMSE Kecepatan Arus</h2>
            <div class="map-container">
                <div id="map-rmse-speed" style="width: 100%; height: 100%;"></div>
                <div class="rmse-overlay">
                    <div class="title">Rata-Rata Spasial</div>
                    <div class="value"><span id="rmse-speed-val">-</span> <span class="unit">m/s</span></div>
                    <div class="badge badge-good" id="badge-speed">-</div>
                </div>
            </div>
        </div>

        <div class="glass-panel" style="height: 450px;">
            <h2>🧭 Validasi Spasial: RMSE Arah Arus</h2>
            <div class="map-container">
                <div id="map-rmse-dir" style="width: 100%; height: 100%;"></div>
                <div class="rmse-overlay">
                    <div class="title">Rata-Rata Spasial</div>
                    <div class="value"><span id="rmse-dir-val">-</span> <span class="unit">Derajat</span></div>
                    <div class="badge badge-warn" id="badge-dir">-</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const BASE_API_URL = 'https://jubilant-fishstick-p5xxxq9jx9vf7jgx-8000.app.github.dev'; 
        let forecastChartObj = null;
        let validationChartObj = null;

// FUNGSI 1: LOAD BASERUNS 
        async function loadBaseruns() {
            try {
                let response = await fetch(`${BASE_API_URL}/api/baseruns`);
                if (!response.ok) return;
                let jsonRes = await response.json();
                
                let fileList = jsonRes.data || []; 
                let dropdown = document.getElementById('baserun-dropdown');
                dropdown.innerHTML = ''; 

                if (fileList.length === 0) return;

                fileList.forEach((file, index) => {
                    let option = document.createElement('option');
                    // Karena dari Python udah distandarkan, kita panggil object-nya aman
                    option.value = file.filename;
                    option.text = index === 0 ? file.label + " (Terbaru)" : file.label;
                    dropdown.appendChild(option);
                });

                // Load grafik menggunakan nama file index pertama
                loadForecastData(fileList[0].filename);
                
                dropdown.addEventListener('change', function() { 
                    loadForecastData(this.value); 
                });
            } catch (err) {
                console.error("Gagal meload daftar baserun:", err);
            }
        }

        // FUNGSI 2: LOAD GRAFIK PRAKIRAAN
        async function loadForecastData(filename) {
            try {
                loadValidationData(filename); // Jangan lupa panggil fungsi sebelah

                let response = await fetch(`${BASE_API_URL}/api/forecast-12h?filename=${filename}`);
                if (!response.ok) throw new Error("API Forecast gagal");
                let data = await response.json();

                if(data.title_range) {
                    document.getElementById('forecast-title').innerText = `📈 Prakiraan Operasional ${data.title_range}`;
                }

                if (data.waktu.length === 0) return;

                let dinamicAnnotations = {};
                let yMaxGlobal = Math.max(...data.kecepatan) + 0.5;

                data.anotasi_blok.forEach((blok, index) => {
                    // Logika index shift
                    let startIndex = index * 3;
                    let endIndex = Math.min(startIndex + 2, data.waktu.length - 1);
                    
                    let boxMin = startIndex - 0.5;
                    let boxMax = endIndex + 0.5;
                    let boxCenter = (startIndex + endIndex) / 2;

                    let bgColor = (index % 2 === 0) ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0)';
                    
                    dinamicAnnotations[`box${index}`] = { type: 'box', xMin: boxMin, xMax: boxMax, backgroundColor: bgColor, borderWidth: 0 };
                    dinamicAnnotations[`lbl${index}`] = {
                        type: 'label', xValue: boxCenter, yValue: yMaxGlobal - 0.2, 
                        content: [`Maks: ${blok.max_v.toFixed(2)} m/s`, `Arah: ${blok.arah}`], 
                        color: '#94a3b8', font: {size: 10}, textAlign: 'center'
                    };
                });

                if(forecastChartObj !== null) {
                    forecastChartObj.data.labels = data.waktu;
                    forecastChartObj.data.datasets[0].data = data.kecepatan;
                    forecastChartObj.options.scales.y.suggestedMax = yMaxGlobal;
                    forecastChartObj.options.plugins.annotation.annotations = dinamicAnnotations;
                    forecastChartObj.update(); 
                } else {
                    const ctxForecast = document.getElementById('forecastChart').getContext('2d');
                    forecastChartObj = new Chart(ctxForecast, {
                        type: 'line',
                        data: {
                            labels: data.waktu,
                            datasets: [{
                                label: 'Kecepatan Model (m/s)', data: data.kecepatan,
                                borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                borderWidth: 3, fill: true, tension: 0.4, pointBackgroundColor: '#0ea5e9', pointRadius: 4
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            animation: { duration: 800 }, 
                            plugins: { legend: { display: false }, annotation: { annotations: dinamicAnnotations } },
                            scales: { x: { ticks: { color: '#94a3b8' }, grid: { display: false }, offset: true }, y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.1)' }, suggestedMin: 0, suggestedMax: yMaxGlobal } }
                        }
                    });
                }
            } catch (err) { console.error("Gagal meload grafik prakiraan:", err); }
        }

// FUNGSI 3: LOAD GRAFIK VALIDASI
        async function loadValidationData(filename) {
            try {
                let response = await fetch(`${BASE_API_URL}/api/validation-12h?filename=${filename}`);
                if (!response.ok) throw new Error("API Validation gagal");
                let data = await response.json();

                if(data.title_range) {
                    document.getElementById('validation-title').innerText = `✅ Validasi Model vs HF Radar ${data.title_range}`;
                }

                if (data.waktu.length === 0) return;

                // 1. FILTER TITIK PER JAM: Kalau jumlah data <= 3 (50% dari 6), jadikan null biar grafiknya putus
                let observasiTersaring = data.observasi.map((obs, i) => {
                    return (data.jumlah_data && data.jumlah_data[i] > 3) ? obs : null;
                });

                let dinamicAnnotations = {};
                let maxPred = Math.max(...data.prediksi);
                let maxObs = Math.max(...observasiTersaring.filter(n => n !== null && !isNaN(n)));
                let yMaxGlobal = Math.max(maxPred, maxObs) + 0.5;
                if(!isFinite(yMaxGlobal) || isNaN(yMaxGlobal)) yMaxGlobal = 3.0; 

                data.anotasi_blok.forEach((blok, index) => {
                    // Logika background kotak penuh
                    let startIndex = index * 3;
                    let endIndex = Math.min(startIndex + 2, data.waktu.length - 1);
                    
                    let boxMin = startIndex - 0.5;
                    let boxMax = endIndex + 0.5;
                    let boxCenter = (startIndex + endIndex) / 2;
                    let bgColor = (index % 2 === 0) ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0)';

                    // 2. HITUNG TOTAL DATA PER TIMESTEP (3 JAM)
                    let totalDataTimestep = 0;
                    if (data.jumlah_data) {
                        for (let i = startIndex; i <= endIndex; i++) {
                            totalDataTimestep += data.jumlah_data[i] || 0;
                        }
                    }

                    // 3. LOGIKA LABEL: Jika total data > 9 (50% dari 18 maksimal), maka valid
                    let teksObs = "";
                    let teksArah = "";
                    if (totalDataTimestep > 9) {
                        teksObs = blok.max_v !== null ? `Obs: ${blok.max_v.toFixed(2)} m/s` : "Data Kosong";
                        teksArah = `Arah: ${blok.arah}`;
                    } else {
                        teksObs = "Data Tidak Valid";
                        teksArah = "";
                    }
                    
                    dinamicAnnotations[`box${index}`] = { type: 'box', xMin: boxMin, xMax: boxMax, backgroundColor: bgColor, borderWidth: 0 };
                    dinamicAnnotations[`lbl${index}`] = {
                        type: 'label', xValue: boxCenter, yValue: yMaxGlobal - 0.2, 
                        content: [teksObs, teksArah], color: '#94a3b8', font: {size: 10}, textAlign: 'center'
                    };
                });

                if(validationChartObj !== null) {
                    // Update data secara dinamis
                    validationChartObj.data.labels = data.waktu;
                    validationChartObj.data.datasets[0].data = data.prediksi;
                    // Masukkan data observasi yang sudah di-filter
                    validationChartObj.data.datasets[1].data = observasiTersaring; 
                    validationChartObj.options.scales.y.suggestedMax = yMaxGlobal;
                    validationChartObj.options.plugins.annotation.annotations = dinamicAnnotations;
                    validationChartObj.update(); 
                } else {
                    // Bikin baru saat pertama kali diload
                    const ctxValidation = document.getElementById('validationChart').getContext('2d');
                    validationChartObj = new Chart(ctxValidation, {
                        type: 'line',
                        data: {
                            labels: data.waktu,
                            datasets: [
                                { label: 'Prediksi Model', data: data.prediksi, borderColor: '#38bdf8', borderWidth: 2, borderDash: [5, 5], fill: false, tension: 0.4, pointRadius: 0 },
                                // Masukkan data observasi yang sudah di-filter
                                { label: 'Observasi Radar', data: observasiTersaring, borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.1)', borderWidth: 3, fill: true, tension: 0.4, pointBackgroundColor: '#e11d48', pointRadius: 4, spanGaps: true }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            animation: { duration: 800 }, 
                            plugins: { legend: { display: true, position: 'bottom', labels: { color: '#cbd5e1', font: {size: 11}, boxWidth: 15 } }, annotation: { annotations: dinamicAnnotations } },
                            scales: { 
                                x: { 
                                    ticks: { color: '#94a3b8' }, 
                                    grid: { display: false },
                                    offset: true // Menambahkan ruang agar kotak background tidak terpotong
                                }, 
                                y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148,163,184,0.1)' }, suggestedMin: 0, suggestedMax: yMaxGlobal } 
                            }
                        }
                    });
                }
            } catch (err) { console.error("Gagal meload grafik validasi:", err); }
        }

        // FUNGSI 4: PETA SPASIAL SUNGGUHAN
        let mapSpeed, mapDir;
        let heatLayerSpeed, heatLayerDir;

        function initMaps() {
            // Inisialisasi peta kosong
            mapSpeed = L.map('map-rmse-speed', { zoomControl: false, dragging: true, scrollWheelZoom: false, attributionControl: false }).setView([-8.130, 114.435], 11);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}').addTo(mapSpeed);
            
            mapDir = L.map('map-rmse-dir', { zoomControl: false, dragging: true, scrollWheelZoom: false, attributionControl: false }).setView([-8.130, 114.435], 11);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}').addTo(mapDir);
        }

        async function loadSpatialData(filename) {
            try {
                let response = await fetch(`${BASE_API_URL}/api/rmse-spatial?filename=${filename}`);
                let data = await response.json();

                // Bersihkan layer gambar lama
                if(heatLayerSpeed) mapSpeed.removeLayer(heatLayerSpeed);
                if(heatLayerDir) mapDir.removeLayer(heatLayerDir);

                if (!data.img_speed) {
                    document.getElementById('rmse-speed-val').innerText = "-";
                    document.getElementById('rmse-dir-val').innerText = "-";
                    return;
                }

                // Tempel Gambar yang digenerate oleh Python
                let urlSpeed = 'data:image/png;base64,' + data.img_speed;
                heatLayerSpeed = L.imageOverlay(urlSpeed, data.bounds, { opacity: 0.85 }).addTo(mapSpeed);
                
                let urlDir = 'data:image/png;base64,' + data.img_dir;
                heatLayerDir = L.imageOverlay(urlDir, data.bounds, { opacity: 0.85 }).addTo(mapDir);

                // Update Text Angka
                document.getElementById('rmse-speed-val').innerText = data.avg_speed.toFixed(2);
                document.getElementById('rmse-dir-val').innerText = data.avg_dir.toFixed(1);

                // Logika Badge Kecepatan
                let badgeSpeed = document.getElementById('badge-speed');
                if(data.avg_speed <= 0.3) { badgeSpeed.className = "badge badge-good"; badgeSpeed.innerText = "Sangat Akurat"; }
                else if(data.avg_speed <= 0.6) { badgeSpeed.className = "badge badge-warn"; badgeSpeed.innerText = "Batas Toleransi"; }
                else { badgeSpeed.className = "badge"; badgeSpeed.style.background = "rgba(239,68,68,0.2)"; badgeSpeed.style.color = "#ef4444"; badgeSpeed.innerText = "Kurang Akurat"; }

                // Logika Badge Arah
                let badgeDir = document.getElementById('badge-dir');
                if(data.avg_dir <= 15) { badgeDir.className = "badge badge-good"; badgeDir.innerText = "Sangat Akurat"; }
                else if(data.avg_dir <= 30) { badgeDir.className = "badge badge-warn"; badgeDir.innerText = "Batas Toleransi"; }
                else { badgeDir.className = "badge"; badgeDir.style.background = "rgba(239,68,68,0.2)"; badgeDir.style.color = "#ef4444"; badgeDir.innerText = "Kurang Akurat"; }

            } catch (err) { console.error("Gagal load Spasial:", err); }
        }

        // PANGGILAN OTOMATIS SAAT BASERUN DIGANTI
        // Kita modif loadForecastData lu (di bagian paling atasnya) biar manggil loadSpatialData
        const originalLoadForecastData = loadForecastData;
        loadForecastData = async function(filename) {
            loadSpatialData(filename); // Sisipkan panggilan fungsi spasial di sini
            originalLoadForecastData(filename);
        }

        // INIT
        initMaps();
        loadBaseruns();

    </script>
</body>
</html>
