name: Exploratory Data Analysis (Modul 2)

on:
  # Trigger manual karena EDA biasanya cuma dijalankan saat butuh ngecek karakteristik data
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-eda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # PERHATIAN: Gw tambahin 'seaborn' di sini karena skrip EDA tadi pakenya seaborn
          pip install pandas numpy xarray scipy scikit-learn joblib requests "tensorflow<2.16" matplotlib seaborn python-dotenv netCDF4 openpyxl bottleneck

      - name: Download & Extract Dataset Historis (GitHub Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "00 Data"
          gh release download v1.0-dataset -p "4_dataset_arus.zip" --dir "00 Data"
          unzip -o "00 Data/4_dataset_arus.zip" -d "00 Data/"

      - name: Extract Data Arus dan Pasut
        env:
          HFRADAR_URL: ${{ secrets.HFRADAR_URL }}
        run: python "extractdata.py"

      - name: Spatial Pre-processing (Menghasilkan .NC)
        run: python "Spatial Pre-processing.py"

      - name: Run Analisis Statistik (EDA)
        run: python "02a_eda_statistics.py"

      - name: Auto-Commit & Push Hasil Visualisasi EDA
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Hanya menangkap file gambar hasil distribusi ke dalam repo
          git add -f "outputs/distribusi_statistik_arus.png" 2>/dev/null || true
          
          git commit -m "Auto-update: Hasil plot distribusi EDA Statistik (Modul 2) [skip ci]" || exit 0
          git push origin main
