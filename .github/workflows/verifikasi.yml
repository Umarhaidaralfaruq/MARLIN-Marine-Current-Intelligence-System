name: Verifikasi Arus Selat Bali

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xarray scipy scikit-learn joblib requests "tensorflow<2.16" matplotlib python-dotenv netCDF4 openpyxl bottleneck cloudscraper dotenv

      - name: Run 1 - Data Collector (HF Radar)
        env:
          # Memanggil Secret dari GitHub
          HFRADAR_URL: ${{ secrets.HFRADAR_URL }}
        run: python extractdata.py

      - name: Cek Isi File Error
        run: cat "00 Data/1_Hasil_HFRadar_SelatBali_Ketapang.nc" | head -n 50

      - name: Run 2 - Spatial Pre-processing
        run: python "Spatial Pre-processing.py"

      - name: Run 3 - Data Preparation (EOF)
        run: python "Data Prep.py"
        
      - name: Run 4 - Auto Validation
        run: python verification.py

      - name: Auto-Commit & Push Hasil Validasi
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -f Hasil_Validasi/*.csv
          git commit -m "Auto-update: Hasil validasi terbaru [skip ci]" || exit 0
          git push origin main
